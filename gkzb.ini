; GFW 域名代理
ruleset=🚀 节点选择,[]GEOSITE,gfw

; 非中国大陆域名代理
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn


; ---------- 最终兜底 ----------

ruleset=🐟 漏网之鱼,[]FINAL



; ============================================================
; 二、业务策略组
; select 类型中，第一个选项为默认选项
; ============================================================

; ---------- 总节点选择 ----------

custom_proxy_group=🚀 节点选择`select`[]🔯 香港自动`[]♻️ 自动选择`[]🔯 台湾自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]🔯 澳大利亚自动`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇦🇺 澳大利亚节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT


; ---------- AI ----------

; 美国节点通常对 OpenAI、Claude、Gemini 等服务兼容性更好
custom_proxy_group=🤖 AI`select`[]🔯 美国自动`[]🔯 日本自动`[]🔯 台湾自动`[]🔯 澳大利亚自动`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇦🇺 澳大利亚节点`[]🐸 手动切换`[]DIRECT


; ---------- Cursor ----------

; Cursor 默认使用美国节点，避免 DIRECT 导致认证或 API 连接异常
custom_proxy_group=🤖 Cursor`select`[]🔯 美国自动`[]🔯 日本自动`[]🔯 台湾自动`[]🚀 节点选择`[]♻️ 自动选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🐸 手动切换`[]DIRECT


; ---------- Google ----------

custom_proxy_group=🍀 Google`select`[]🔯 香港自动`[]🔯 日本自动`[]🔯 台湾自动`[]🔯 美国自动`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🐸 手动切换`[]DIRECT


; ---------- GitHub ----------

custom_proxy_group=👨🏿‍💻 GitHub`select`[]🔯 香港自动`[]🔯 日本自动`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 台湾自动`[]🔯 美国自动`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🐸 手动切换`[]DIRECT


; ---------- AnyDesk ----------

custom_proxy_group=🖥️ AnyDesk`select`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]🔯 澳大利亚自动`[]♻️ 自动选择`[]🇦🇺 澳大利亚节点`[]🐸 手动切换`[]DIRECT


; ---------- 游戏平台 ----------

; 游戏默认直连，确有连接问题时再手动切换代理
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🔯 香港自动`[]🔯 日本自动`[]🔯 台湾自动`[]🔯 新加坡自动`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🐸 手动切换


; ---------- 国外媒体 ----------

custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🔯 香港自动`[]🔯 台湾自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]🔯 澳大利亚自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇦🇺 澳大利亚节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT


; ---------- 国内媒体 ----------

custom_proxy_group=🎞️ 国内媒体`select`[]DIRECT`[]🚀 节点选择`[]🐸 手动切换


; ---------- 全球直连 ----------

custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🐸 手动切换


; ---------- 漏网之鱼 ----------

; 未命中任何规则的流量默认直连
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 香港自动`[]🔯 台湾自动`[]🔯 日本自动`[]🔯 美国自动`[]🐸 手动切换



; ============================================================
; 三、节点地区分组
; 地区代码使用边界匹配，避免 US 错误匹配 Australia/AUS
; ============================================================

; ---------- 所有节点手动选择 ----------

custom_proxy_group=🐸 手动切换`select`.*


; ---------- 香港节点 ----------

custom_proxy_group=🇭🇰 香港节点`select`(?i)(香港|Hong[\s_-]?Kong|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 台湾节点 ----------

custom_proxy_group=🇹🇼 台湾节点`select`(?i)(台湾|臺灣|台北|新北|彰化|高雄|Taiwan|🇹🇼|(^|[^A-Za-z])TW([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 日本节点 ----------

custom_proxy_group=🇯🇵 日本节点`select`(?i)(日本|东京|東京|大阪|埼玉|Japan|🇯🇵|(^|[^A-Za-z])JP([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 新加坡节点 ----------

; 不使用单独的“坡”字，避免误匹配其他中文节点名称
custom_proxy_group=🇸🇬 新加坡节点`select`(?i)(新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z])SG([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 美国节点 ----------

; US/USA 使用字符边界匹配，避免误匹配 AUS、RUS 等名称
custom_proxy_group=🇺🇸 美国节点`select`(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|芝加哥|纽约|紐約|达拉斯|達拉斯|波特兰|波特蘭|凤凰城|鳳凰城|费利蒙|費利蒙|硅谷|矽谷|United[\s_-]?States|America|🇺🇸|(^|[^A-Za-z])US(A)?([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 澳大利亚节点 ----------

custom_proxy_group=🇦🇺 澳大利亚节点`select`(?i)(澳大利亚|澳大利亞|澳洲|悉尼|雪梨|墨尔本|墨爾本|布里斯班|珀斯|阿德莱德|阿德萊德|Australia|Sydney|Melbourne|Brisbane|Perth|Adelaide|🇦🇺|(^|[^A-Za-z])AU([^A-Za-z]|$))`[]🐸 手动切换


; ---------- 其他地区 ----------

; 排除已经单独分类的香港、台湾、日本、新加坡、美国和澳大利亚节点
custom_proxy_group=🌐 其他地区`select`(?i)^(?!.*(香港|Hong[\s_-]?Kong|🇭🇰|台湾|臺灣|台北|Taiwan|🇹🇼|日本|东京|東京|大阪|Japan|🇯🇵|新加坡|狮城|獅城|Singapore|🇸🇬|美国|美國|洛杉矶|洛杉磯|United[\s_-]?States|America|🇺🇸|澳大利亚|澳大利亞|澳洲|悉尼|雪梨|墨尔本|墨爾本|Australia|Sydney|Melbourne|🇦🇺|(^|[^A-Za-z])(HK|TW|JP|SG|US|USA|AU)([^A-Za-z]|$))).*$`[]🐸 手动切换



; ============================================================
; 四、自动测速组
; 格式：测速间隔 300 秒，超时 5 秒，切换容差 100ms
; ============================================================

; 香港自动测速
custom_proxy_group=🔯 香港自动`url-test`(?i)(香港|Hong[\s_-]?Kong|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 台湾自动测速
custom_proxy_group=🔯 台湾自动`url-test`(?i)(台湾|臺灣|台北|新北|彰化|高雄|Taiwan|🇹🇼|(^|[^A-Za-z])TW([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 日本自动测速
custom_proxy_group=🔯 日本自动`url-test`(?i)(日本|东京|東京|大阪|埼玉|Japan|🇯🇵|(^|[^A-Za-z])JP([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 新加坡自动测速
custom_proxy_group=🔯 新加坡自动`url-test`(?i)(新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z])SG([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 美国自动测速
custom_proxy_group=🔯 美国自动`url-test`(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|芝加哥|纽约|紐約|达拉斯|達拉斯|波特兰|波特蘭|凤凰城|鳳凰城|费利蒙|費利蒙|硅谷|矽谷|United[\s_-]?States|America|🇺🇸|(^|[^A-Za-z])US(A)?([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 澳大利亚自动测速
custom_proxy_group=🔯 澳大利亚自动`url-test`(?i)(澳大利亚|澳大利亞|澳洲|悉尼|雪梨|墨尔本|墨爾本|布里斯班|珀斯|阿德莱德|阿德萊德|Australia|Sydney|Melbourne|Brisbane|Perth|Adelaide|🇦🇺|(^|[^A-Za-z])AU([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,100

; 所有节点自动测速，使用较低的 50ms 切换容差
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,5,50



; ============================================================
; 五、规则生成设置
; ============================================================

; 启用自定义规则生成
enable_rule_generator=true

; 使用本配置中的规则覆盖订阅原始规则
overwrite_original_rules=true
