; ============================================================
; GKZB OpenClash / subconverter 公司版（自建线路保护版）
; 功能：规则分流、地区节点分类、低成本自动测速、3x-ui 美日自建节点专用
; 贵流量保护：全部自动组排除美日 company 自建节点；personal 节点仍可参与测速
; ============================================================

[custom]

; ============================================================
; 一、规则集定义
; 规则从上向下匹配，越具体、优先级越高的规则应越靠前
; ============================================================

; ---------- 局域网及用户强制直连 ----------

; 局域网地址必须直连，避免访问路由器、NAS、PVE 等设备时走代理
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list,28800

; 兼容模式：暂引用原始 Direct.list，其他公司专项优化已生效
ruleset=🎯 全球直连,https://raw.githubusercontent.com/huchengduo/openclash/refs/heads/main/Direct.list,28800

; Aethersailor 自定义直连规则
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list,28800

; ---------- 游戏下载及国内游戏直连 ----------

; Steam 下载节点直连，避免下载流量占用代理
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN.list,28800

; 常见游戏下载 CDN 直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Game_Download_CDN.list,28800

; 国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

; ---------- AI 专项分流 ----------

; 公司使用的 AI 域名规则，沿用仓库现有 AI.list
ruleset=🤖 AI,https://raw.githubusercontent.com/huchengduo/openclash/refs/heads/main/AI.list,28800

; Anthropic / Claude
ruleset=🤖 AI,[]GEOSITE,anthropic

; Google Gemini
ruleset=🤖 AI,[]GEOSITE,google-gemini

; ---------- Cursor 专项分流 ----------

; Cursor 官方服务域名，沿用仓库现有 Cursor.list
ruleset=🤖 Cursor,https://raw.githubusercontent.com/huchengduo/openclash/refs/heads/main/Cursor.list,28800

; ---------- GitHub 专项分流 ----------

ruleset=👨🏿‍💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list,28800
ruleset=👨🏿‍💻 GitHub,[]GEOSITE,github

; ---------- YouTube 视频优先分流（必须先于 Google 规则） ----------

ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list,28800

; ---------- Google 专项分流 ----------

ruleset=🍀 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list,28800

; ---------- 游戏平台分流 ----------

ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list,28800
ruleset=🎮 游戏平台,[]GEOSITE,steam
ruleset=🎮 游戏平台,[]GEOSITE,category-games

; ---------- 国内媒体 ----------

ruleset=🎞️ 国内媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list,28800

; ---------- 国外媒体 ----------

ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list,28800
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list,28800
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list,28800
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list,28800

; ---------- 通用直连规则 ----------

; 公共 Tracker 直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; blackmatrix7 通用直连列表
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list,28800

; 中国大陆域名直连；GEOIP,CN 放在外国域名规则之后
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,cn

; ---------- 通用国外代理规则 ----------

; GFW 域名代理
ruleset=🚀 节点选择,[]GEOSITE,gfw

; 非中国大陆域名代理（之后再做中国 IP 兜底）
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn

; Unknown domains: keep Chinese IP direct only after the known foreign-domain lists.
ruleset=🎯 全球直连,[]GEOIP,CN

; ---------- 最终兜底 ----------

ruleset=🐟 漏网之鱼,[]FINAL

; ============================================================
; 二、业务策略组
; select 类型中，第一个选项为默认选项
; ============================================================

; ---------- 总节点选择 ----------
custom_proxy_group=🚀 节点选择`select`[]🔯 新加坡自动`[]🔯 香港自动`[]🔯 台湾自动`[]🔯 日本自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- AI ----------
; 默认选择美国节点组：该组可包含 company 与 personal 节点
custom_proxy_group=🤖 AI`select`[]🇺🇸 美国节点`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- Cursor ----------
; 默认选择日本节点组：该组可包含 company 与 personal 节点
custom_proxy_group=🤖 Cursor`select`[]🇯🇵 日本节点`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- Google ----------
custom_proxy_group=🍀 Google`select`[]🇺🇸 美国节点`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- GitHub ----------
custom_proxy_group=👨🏿‍💻 GitHub`select`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- 游戏平台 ----------
; 默认使用日本自动；仍保留 DIRECT 供手动切换
custom_proxy_group=🎮 游戏平台`select`[]🔯 日本自动`[]DIRECT`[]🚀 节点选择`[]🔯 香港自动`[]🔯 台湾自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换

; ---------- 国外媒体 ----------
custom_proxy_group=🌍 国外媒体`select`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ---------- 国内媒体 ----------
custom_proxy_group=🎞️ 国内媒体`select`[]DIRECT`[]🚀 节点选择`[]🐸 手动切换

; ---------- 全球直连 ----------
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]🐸 手动切换

; ---------- 漏网之鱼 ----------
; 默认交给台湾自动（无台湾节点时该组可能为空）
custom_proxy_group=🐟 漏网之鱼`select`[]🔯 台湾自动`[]🚀 节点选择`[]🔯 香港自动`[]🔯 日本自动`[]🔯 新加坡自动`[]🔯 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🐸 手动切换`[]DIRECT

; ============================================================
; 三、节点地区分组
; 地区代码使用边界匹配，避免 US 错误匹配其他地区名称
; ============================================================

; ---------- 所有节点手动选择 ----------
; 手动组保留全部原始订阅节点，包括自建节点
custom_proxy_group=🐸 手动切换`select`(?i)^Pro\-美国\-BGP\-05\|v202605$`(?i)^(?!Pro\-美国\-BGP\-05\|v202605$).*$

; ---------- 香港节点 ----------
custom_proxy_group=🇭🇰 香港节点`select`(?i)^香港\-01$`(?i)^(?!香港\-01$)(?=.*(?:香港|Hong[\s_-]?Kong|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$))).*$

; ---------- 台湾节点 ----------
custom_proxy_group=🇹🇼 台湾节点`select`(?i)^Pro\-台湾\-BGP\-03\|v202605$`(?i)^(?!Pro\-台湾\-BGP\-03\|v202605$)(?=.*(?:台湾|臺灣|台北|新北|彰化|高雄|Taiwan|🇹🇼|(^|[^A-Za-z])TW([^A-Za-z]|$))).*$

; ---------- 日本节点：兼容国旗前缀、company/personal 后缀 ----------
; 不使用 ^ 限制开头，匹配“🇯🇵 JP-DMIT-Personal”等名称
custom_proxy_group=🇯🇵 日本节点`select`(?i)JP-DMIT

; ---------- 新加坡节点 ----------
; 不使用单独的“坡”字，避免误匹配其他中文节点名称
custom_proxy_group=🇸🇬 新加坡节点`select`(?i)^Pro\-新加坡\-BGP\-02\|v202605$`(?i)^(?!Pro\-新加坡\-BGP\-02\|v202605$)(?=.*(?:新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z])SG([^A-Za-z]|$))).*$

; ---------- 美国节点：兼容国旗前缀、company/personal 后缀 ----------
; 不使用 ^ 限制开头，匹配“🇺🇸 US-DMIT-Personal”等名称
custom_proxy_group=🇺🇸 美国节点`select`(?i)US-DMIT

; ---------- 其他地区 ----------
; 其他地区排除已明确分组的港、台、日、新、美节点；其他节点正常保留
custom_proxy_group=🌐 其他地区`select`(?i)^Pro\-韩国\-02\|v202605$`(?i)^(?!Pro\-韩国\-02\|v202605$)(?!.*(?:香港|Hong[\s_-]?Kong|🇭🇰|台湾|臺灣|台北|Taiwan|🇹🇼|日本|东京|東京|大阪|Japan|🇯🇵|新加坡|狮城|獅城|Singapore|🇸🇬|美国|美國|洛杉矶|洛杉磯|United[\s_-]?States|America|🇺🇸|(^|[^A-Za-z])(?:HK|TW|JP|SG|US|USA)([^A-Za-z]|$))).*$

; ============================================================
; 四、自动测速组
; 格式：测速间隔 300 秒，超时 5 秒，切换容差 100ms
; 仅排除 company 节点，personal 节点仍可能参加测速
; ============================================================

; 香港自动测速
custom_proxy_group=🔯 香港自动`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company))(?=.*(香港|Hong[\s_-]?Kong|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$))).*$`https://www.gstatic.com/generate_204`300,5,100

; 台湾自动测速
custom_proxy_group=🔯 台湾自动`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company))(?=.*(台湾|臺灣|台北|新北|彰化|高雄|Taiwan|🇹🇼|(^|[^A-Za-z])TW([^A-Za-z]|$))).*$`https://www.gstatic.com/generate_204`300,5,100

; 日本自动测速：排除 company，personal 可参与测速
custom_proxy_group=🔯 日本自动`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company))(?=.*(日本|东京|東京|大阪|埼玉|Japan|🇯🇵|(^|[^A-Za-z])JP([^A-Za-z]|$))).*$`https://www.gstatic.com/generate_204`300,5,100

; 新加坡自动测速
custom_proxy_group=🔯 新加坡自动`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company))(?=.*(新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z])SG([^A-Za-z]|$))).*$`https://www.gstatic.com/generate_204`300,5,100

; 美国自动测速：排除 company，personal 可参与测速
custom_proxy_group=🔯 美国自动`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company))(?=.*(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|芝加哥|纽约|紐約|达拉斯|達拉斯|波特兰|波特蘭|凤凰城|鳳凰城|费利蒙|費利蒙|硅谷|矽谷|United[\s_-]?States|America|🇺🇸|(^|[^A-Za-z])US(A)?([^A-Za-z]|$))).*$`https://www.gstatic.com/generate_204`300,5,100

; 所有机场及未被排除的节点自动测速：排除美日 company 自建节点
; 继续采用 100ms 切换容差，减少频繁切换
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(?:US-DMIT-company|JP-DMIT-company)).+`https://www.gstatic.com/generate_204`300,5,100

; ============================================================
; 五、规则生成设置
; ============================================================

; 启用自定义规则生成
enable_rule_generator=true

; 使用本配置中的规则覆盖订阅原始规则
overwrite_original_rules=true
